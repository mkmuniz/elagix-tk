# Layer B — specs.md §5.3. Target: `docker images`, which scored 72.7% for
# RTK (audit section 10.1, "Good" tier). `<none>:<none>` is untagged
# intermediate-layer noise — rarely relevant to the agent.
match_command = "docker"
match_args_prefix = ["images"]

[[pipeline]]
action = "strip_lines_matching"
patterns = ["^<none>\\s+<none>"]

[[pipeline]]
action = "max_lines"
limit = 15

[[pipeline]]
action = "on_empty"
message = "docker images: no images"
