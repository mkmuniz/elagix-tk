# Camada B — specs.md §5.3. Alvo: `docker images`, que no RTK rende 72,7%
# (auditoria seção 10.1, faixa "Bom"). `<none>:<none>` é ruído de camada
# intermediária sem tag — raramente relevante pro agente.
match_command = "docker"
match_args_prefix = ["images"]

[[pipeline]]
action = "strip_lines_matching"
patterns = ["^<none>\\s+<none>"]

[[pipeline]]
action = "max_lines"
limit = 15

[[pipeline]]
action = "on_empty"
message = "docker images: nenhuma imagem"
