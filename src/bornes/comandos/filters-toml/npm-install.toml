# Layer B — specs.md §5.3. Target: `npm install`. RTK scored -64.3% on this
# one (audit section 10.1, "got worse") — but due to PATH/plumbing
# divergence (failure type #4, section 10.2), not a strategy failure. The
# strategy itself here: drop cascading deprecation warnings (repetitive
# noise per transitive package) and keep just the final summary.
match_command = "npm"
match_args_prefix = ["install"]

[[pipeline]]
action = "strip_lines_matching"
patterns = ["^npm warn deprecated"]

[[pipeline]]
action = "max_lines"
limit = 20

[[pipeline]]
action = "on_empty"
message = "npm install: completed with no output"
