# Layer B — cargo's progress lines on STDERR ("Compiling foo v1.2",
# "Downloaded ..."): one per crate on a fresh build. Complements the Layer A
# `cargo test` parser (which only sees stdout). Warnings, errors, "Finished"
# and "Running" all stay.
match_command = "cargo"
match_args_prefix = ["build|b|check|c|clippy|test|t|run|r|doc|bench"]
stream = "stderr"

[[pipeline]]
action = "strip_lines_matching"
patterns = [
    "^\\s+(Compiling|Checking|Downloaded|Downloading|Updating|Locking|Adding|Blocking|Fresh|Documenting) ",
]
