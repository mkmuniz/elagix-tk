# Layer B — specs.md §5.3. Target: `git branch -a`, which lands in the
# 1-42% range for RTK (audit section 10.1) — repositories with lots of stale
# remote branches (`remotes/origin/HEAD`, already-merged PR branches)
# produce long, low-value lists.
match_command = "git"
match_args_prefix = ["branch"]

[[pipeline]]
action = "strip_lines_matching"
patterns = ["remotes/origin/HEAD"]

[[pipeline]]
action = "max_lines"
limit = 25

[[pipeline]]
action = "on_empty"
message = "git branch: no branches"
