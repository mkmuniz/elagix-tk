# Layer B — `git pull` / `git merge`. Validated against real output
# (2026-09-24): the diffstat lists one line per changed file plus one
# "create mode" line per new file — 55 lines for a 26-file pull. Collapsed
# into recoverable markers; "Updating a..b", "Fast-forward", the
# "N files changed" summary and any conflict message stay.
match_command = "git"
match_args_prefix = ["pull|merge"]

[[pipeline]]
action = "collapse_lines_matching"
patterns = ["^ \\S.*\\|\\s+(\\d+ ?[+-]*|Bin .*)$"]
label = "diffstat, one line per file"

[[pipeline]]
action = "collapse_lines_matching"
patterns = ["^ (create|delete) mode \\d+ ", "^ rename .* \\(\\d+%\\)$", "^ mode change \\d+ => \\d+ "]
label = "file mode changes"
